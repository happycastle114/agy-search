name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust components
        run: rustup component add clippy rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint every target
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run all tests
        run: cargo test --all-targets --all-features --locked
      - name: Build the release binary
        run: cargo build --release --locked
      - name: Smoke-test the standalone artifact
        run: |
          test "$(./target/release/agy-search --version)" = "agy-search 0.2.0"
          test "$(stat -c %s ./target/release/agy-search)" -lt 8388608
