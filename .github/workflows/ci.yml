name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Rust components
        run: rustup component add clippy rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint every target
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Run all tests
        run: cargo test --all-targets --all-features --locked
      - name: Build the distribution binary
        run: cargo build --profile dist --locked
      - name: Smoke-test the standalone artifact
        run: |
          test "$(./target/dist/agy-search --version)" = "agy-search 0.2.4"
          test "$(stat -c %s ./target/dist/agy-search)" -lt 1258291
