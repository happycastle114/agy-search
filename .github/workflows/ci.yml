name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Rust components
        run: rustup component add clippy rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint every target
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Run all tests
        run: cargo test --all-targets --all-features --locked
      - name: Build the distribution binary
        run: cargo build --profile dist --locked --bin agy-search
      - name: Smoke-test the standalone artifact
        run: |
          package_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "agy-search") | .version')
          binary_version=$(./target/dist/agy-search --version)
          binary_bytes=$(stat -c %s ./target/dist/agy-search)
          binary_budget_bytes=1677722
          printf 'package_version=%s\nbinary_version=%s\nbinary_bytes=%s\nbinary_budget_bytes=%s\n' \
            "$package_version" "$binary_version" "$binary_bytes" "$binary_budget_bytes"
          test "$binary_version" = "agy-search $package_version"
          test "$binary_bytes" -lt "$binary_budget_bytes"
      - name: Build and smoke-test the optional server artifact
        run: |
          package_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "agy-search") | .version')
          cargo build --profile dist --locked --features server --bin agy-search-server
          server_version=$(./target/dist/agy-search-server --version)
          printf 'package_version=%s\nserver_version=%s\n' \
            "$package_version" "$server_version"
          test "$server_version" = "agy-search-server $package_version"
