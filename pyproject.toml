[project]
name = "agy-search"
version = "0.1.0"
description = "Source-backed web research CLI for Google Antigravity"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "happycastle114" },
]
keywords = [
    "antigravity",
    "cli",
    "crawl",
    "research",
    "search",
]
dependencies = [
    "anyio==4.14.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "typer==0.27.0",
]

[project.urls]
Changelog = "https://github.com/happycastle114/agy-search/releases"
Issues = "https://github.com/happycastle114/agy-search/issues"
Repository = "https://github.com/happycastle114/agy-search"

[project.scripts]
agy-search = "agy_search.cli:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright==1.39.9",
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agy_search"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/skills/agy-search",
    "/src",
    "/tests",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
markers = ["real_agy: opt-in tests requiring authenticated Google Antigravity CLI"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D203",
    "D213",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"src/agy_search/cli.py" = ["FBT002", "PLR0913"]
"tests/**/*.py" = ["ARG", "D", "PLR2004", "S101", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"
